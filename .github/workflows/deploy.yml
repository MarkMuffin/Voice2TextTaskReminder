name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Step 1: full CI (lint + typecheck + tests) ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app/ tests/

      - name: Format check (ruff format)
        run: ruff format --check app/ tests/

      - name: Type check (mypy)
        run: mypy app/

      - name: Tests
        run: pytest tests/ -v --tb=short

  # ── Step 2: deploy to VPS (only if tests passed) ────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -x
          # Guard: never rsync if DEPLOY_PATH is empty or root
          if [[ -z "$DEPLOY_PATH" || "$DEPLOY_PATH" == "/" ]]; then
            echo "ERROR: DEPLOY_PATH is empty or root — aborting to prevent data loss"
            exit 1
          fi
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='venv/' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.mypy_cache' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Build and restart container
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $DEPLOY_PATH \
             && docker compose -f docker-compose.prod.yml up -d --build \
             && docker image prune -f"
